[package]
name = "retrosim_app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "retrosim"
path = "src/main.rs"

[dependencies]
retrosim_sim = { path = "../retrosim_sim" }
bevy = { version = "=0.18.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_winit", "ui_bevy_render", "default_font", "png", "bevy_log"] }
